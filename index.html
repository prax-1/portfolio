<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        .section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            color: white;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .project {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .project img {
            width: 40%;
            border-radius: 10px;
        }
        .project:nth-child(even) {
            flex-direction: row-reverse;
        }
        nav {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin: 0 10px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#resume">Resume</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    
    <section id="home" class="section">
        <div class="overlay">
            <h1>Welcome to My Portfolio</h1>
            <p>Here you'll find all my projects and resume</p>
        </div>
    </section>

    <section id="projects" class="section">
        <div class="overlay">
            <h2>Projects</h2>
            <div class="project">
                <div class="project-info">
                    <h3>Project 1</h3>
                    <p>Description of Project 1...</p>
                </div>
                <img src="https://source.unsplash.com/400x300/?technology" alt="Project 1">
            </div>
            <div class="project">
                <img src="https://source.unsplash.com/400x300/?coding" alt="Project 2">
                <div class="project-info">
                    <h3>Project 2</h3>
                    <p>Description of Project 2...</p>
                </div>
            </div>
        </div>
    </section>

    <section id="resume" class="section">
        <div class="overlay">
            <h2>Resume</h2>
            <iframe src="resume.pdf" width="80%" height="500px"></iframe>
        </div>
    </section>

    <section id="contact" class="section">
        <div class="overlay">
            <h2>Contact</h2>
            <p>Email: your.email@example.com</p>
            <p>LinkedIn: linkedin.com/in/yourprofile</p>
            <form action="mailto:your.email@example.com" method="post" enctype="text/plain">
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                <button type="submit">Send</button>
            </form>
        </div>
    </section>
</body>
</html>
